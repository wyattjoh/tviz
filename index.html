<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tviz</title>
    <meta
      name="description"
      content="See where a finished Claude Code session's context window went, call by call. Drop a transcript in your browser — nothing is uploaded."
    />

    <!-- A `summary` card rather than `summary_large_image`: there is no
         1200x630 asset to point at, and a large-image card with a missing
         image renders worse than a small one with the favicon. Dropping an
         og.png into `public/` and switching `twitter:card` is the only change
         an upgrade needs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tviz" />
    <meta property="og:title" content="tviz — where your Claude Code context window went" />
    <meta
      property="og:description"
      content="See where a finished Claude Code session's context window went, call by call. Drop a transcript in your browser — nothing is uploaded."
    />
    <meta property="og:url" content="https://tviz.wyattjoh.workers.dev/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
