name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys running at once would race on the shared Cloudflare state store.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Check and deploy (prod)
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs, not tags: a tag is
      # mutable, and both of these run in the same job as a Cloudflare token
      # that can write Workers to the account. `setup-bun` in particular
      # installs the binary that later executes the deploy step.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned for the same reason, and to match the repo's other exact
          # pins (alchemy beta.75, effect beta.107 in the app and rc.112 in
          # infra/).
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `infra/` is a separate package with its own lockfile so Alchemy's
      # `effect` (rc) never displaces the app's (beta) — see ADR-0007.
      - name: Install infra dependencies
        run: bun run infra:install

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun run test

      # Two projects, two typecheck commands. Alchemy's Website.Vite runs
      # `vite build`, which strips types without checking them, so neither
      # `tsc` runs as part of the deploy — they have to run here.
      - name: Typecheck app
        run: bun run typecheck

      - name: Typecheck infra
        run: bun run infra:typecheck

      # `vite build` itself is not run separately: Website.Vite runs the app's
      # own Vite config, so the deploy produces the same bundle `bun run build`
      # would and uploads it as the Worker's static assets.
      - name: Deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
