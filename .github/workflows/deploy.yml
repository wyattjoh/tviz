name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys running at once would race on the shared Cloudflare state store.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Check and deploy (prod)
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs, not tags: a tag is
      # mutable, and both of these run in the same job as a Cloudflare token
      # that can write Workers to the account. `setup-bun` in particular
      # installs the binary that later executes the deploy step.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned for the same reason, and to match the repo's other exact
          # pins (alchemy beta.72, effect beta.107).
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      # `--passWithNoTests` only here: locally, an empty `bun run test` should
      # still fail loudly. Drop this once `src/**/*.test.ts` exists.
      - name: Test
        run: bun run test --passWithNoTests

      # `bun run build` is not run separately: Alchemy's Website.Vite resource
      # runs the project's own Vite build (tsc included) as part of the deploy.
      - name: Deploy
        run: bun alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
