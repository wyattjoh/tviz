name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys running at once would race on the shared Cloudflare state store.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Check and deploy (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      # `--passWithNoTests` only here: locally, an empty `bun run test` should
      # still fail loudly. Drop this once `src/**/*.test.ts` exists.
      - name: Test
        run: bun run test --passWithNoTests

      # `bun run build` is not run separately: Alchemy's Website.Vite resource
      # runs the project's own Vite build (tsc included) as part of the deploy.
      - name: Deploy
        run: bun alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
